name: Build and deploy Hugo Blox

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Tailwind entry point
        run: node scripts/prepare-tailwind.mjs
      - name: Determine the GitHub Pages URL
        id: url
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"
          owner_lower="${owner,,}"
          repo_lower="${repo,,}"
          if [[ "$repo_lower" == "$owner_lower.github.io" ]]; then
            echo "base=https://$owner_lower.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base=https://$owner_lower.github.io/$repo/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the real Hugo website
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.url.outputs.base }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
