bio: |-
  I am currently a first-year PhD student in [the School of Electronic Science and Engineering](https://ese.nju.edu.cn/main.htm) at [Nanjing University](https://www.nju.edu.cn/), supervised by [Prof. Xun Cao](https://cite.nju.edu.cn/People/Faculty/20190621/i5054.html) and [Prof. Hao Zhu](https://pakfa.github.io/zhuhao_photo.github.io/). I studied Optoelectronic Information Science and Engineering at Tongji University from 2022 to 2026.

  My research interests include differentiable optical design, fisheye lens imaging, and computational spectral imaging. I use deep optics techniques to design new imaging systems.
